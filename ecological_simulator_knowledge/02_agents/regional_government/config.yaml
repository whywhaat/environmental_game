  - "Не финансировать неописанный объект с неустановленными правами"
typical_argument: "Поддержка возможна при понятном объекте, источнике и порядке принятия решения; федеральное софинансирование не находится в нашем свободном распоряжении."
counterproposal: "Рассмотрим региональный вклад после обследования; при отказе внешнего источника запускается уменьшенный этап либо повторное согласование."
