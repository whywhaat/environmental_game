    extracted_text_hash: fc7fcc01aa8ef6d5edb85a55b08b3be6cd50058a5dd770508434979d85d71ca4
  paraphrase: До выбора действий выясняются исходное и желаемое состояния, границы рассматриваемой системы и состав
    заинтересованных участников. Подмена проблемы удобным симптомом ухудшает дальнейший анализ.
  adaptation:
    origin: analyst_proposal
    description: Каждая начальная позиция города N отдельно описывает экологическую, инфраструктурную и социальную
      проблему. Улучшение имиджа не объявляется устранением загрязнения.
    application_condition: Начальная позиция либо существенная смена предмета переговоров.
    positive_example: Город выделяет реконструкцию и расследование аварии как связанные, но разные задачи.
    negative_example: Холдинг предлагает только позитивные публикации как решение загрязнения.
    evidence_required:
    - Карточка проблемы
    - Граница проекта
    - Установленные факты и неизвестные
    check_id: METHOD-CHECK-01
    approved: false
  scope_limit: Книжный кейс и его числа не становятся фактами города N.
  source_text_status: relevant_pages_reviewed
  independent_fact_verification: false
  legal_force: false
