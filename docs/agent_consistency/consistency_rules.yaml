      "detect_when": [
        "Меняется позиция по тому же предмету без прежней версии, причины или проверяемого обстоятельства"
      ],
      "not_a_violation_when": [
        "Есть допустимое основание, полномочия и ресурс",
        "Различаются предметы или этапы, а не одна позиция"
