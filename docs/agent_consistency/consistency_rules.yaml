      "required_evidence": [
        "Предыдущая и новая позиция",
        "reason_code",
        "trigger_refs",
        "Проверки мандата, лимита и принятых условий"
      ],
      "severity": "major",
      "default_decision": "request_correction",
      "missing_evidence_decision": "request_evidence",
      "effect": "Запросить объяснение; не запрещать допустимый компромисс и не перезаписывать валидированную позицию до проверки",
      "tests": [
        "CONS-T01",
        "CONS-T02",
        "CONS-T11",
        "CONS-T12",
        "CONS-T15"
      ],
      "classification": "proposed",
