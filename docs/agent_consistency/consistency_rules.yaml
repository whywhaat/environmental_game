    {
      "id": "CONS-AUTH-01",
      "name": "Владелец обязательства и мандат",
      "categories": [
        "AUTHORITY_CONFLICT"
      ],
      "basis": "Детализация исходного игрового ограничения",
      "source_refs": [
        "S-JUDGE",
        "S-PROFILES"
      ],
      "judge_rule_ids": [
        "CITYN-J-001",
        "CITYN-J-002"
      ],
      "detect_when": [
        "Подтверждается чужой расход без согласия владельца",
        "Действие выходит за подтверждённый мандат"
      ],
      "not_a_violation_when": [
        "Явный запрос владельцу без фиксации чужого обязательства",
        "Доказана разрешённая новая версия мандата с моментом действия"
      ],
      "required_evidence": [
        "Автор и версия условия",
        "Мандат",
        "Подтверждение каждого владельца"
      ],
      "severity": "critical",
      "default_decision": "reject_action",
      "missing_evidence_decision": "request_evidence",
      "effect": "Не применять присвоенное обязательство; зависимый протокол не допускать",
      "tests": [
        "CONS-T04",
        "CONS-T10",
        "CONS-T16",
        "CONS-T20"
      ],
      "classification": "requires_decision",
      "source_support": "direct",
      "decision_refs": [
        "DEC-01"
      ],
      "implementation_binding": false
    },
    {
      "id": "CONS-RES-01",
      "name": "Лимит и единый финансовый баланс",
      "categories": [
        "RESOURCE_CONFLICT"
      ],
      "basis": "Детализация исходного игрового ограничения",
      "source_refs": [
        "S-JUDGE",
        "S-RESOURCE",
        "S-SCENARIO"
      ],
      "judge_rule_ids": [
        "CITYN-J-003",
        "CITYN-J-009"
      ],
      "detect_when": [
        "Сумма совместимых собственных нагрузок превышает лимит",
        "Один ресурс посчитан дважды",
        "Условный источник назван подтверждённым покрытием"
      ],
      "not_a_violation_when": [
        "Доказано взаимоисключение целых альтернативных планов",
        "Запрошено изменение лимита без обещания расхода до разрешения"
      ],
      "required_evidence": [
        "Ресурсная карточка и единица",
        "Ветка плана",
        "Все нагрузки и предикаты",
        "Стоимость той же версии"
      ],
      "severity": "critical",
      "default_decision": "request_correction",
      "missing_evidence_decision": "request_evidence",
      "effect": "Не засчитывать невозможный или неподтверждённый ресурс; блокировать зависимый обеспеченный план",
      "tests": [
        "CONS-T03",
        "CONS-T13",
        "CONS-T14",
        "CONS-T19"
      ],
      "classification": "requires_decision",
      "source_support": "direct_with_proposed_accounting_details",
      "decision_refs": [
        "DEC-01",
        "DEC-07"
      ],
      "implementation_binding": false
    },
    {
      "id": "CONS-POS-01",
      "name": "Объяснимость существенного изменения позиции",
      "categories": [
        "POSITION_CONFLICT"
      ],
      "basis": "Новое аналитическое уточнение по заданию; связь с CITYN-J не активирует его автоматически",
