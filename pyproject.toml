[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "environmental-game"
version = "0.1.0"
description = "Переговорная игра об экологической ситуации в городе N и модель последствий"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
include = ["negotiation_game*", "consequences_model*"]
